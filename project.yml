name: Oesap

options:
  minimumXcodeGenVersion: 2.46.0
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark
    exactVersion: 0.9.0

targets:
  Oesap:
    attributes:
      SystemCapabilities:
        com.apple.Keychain:
          enabled: 1
    type: application
    platform: iOS
    sources:
      - path: Sources/Oesap
        excludes:
          - Resources/ThirdPartyNotices.txt
      - path: Sources/Oesap/Resources/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oesap.app
        PRODUCT_NAME: Oesap
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Oesap-Catalyst.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Oesap/Transport/Crypto/Oesap-Bridging-Header.h
    info:
      path: Oesap-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.oesap.app.open
            CFBundleURLSchemes: [agentslinger]
        CFBundleDisplayName: Agent Slinger
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Agent Slinger connects to a Paseo daemon on your local network when you choose a direct host connection.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true

  OesapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/OesapTests
    dependencies:
      - target: Oesap
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oesap.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Oesap

  OesapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/OesapUITests
      - path: Tests/OesapPlatformUITests
    dependencies:
      - target: Oesap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oesap.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Oesap

schemes:
  Oesap:
    build:
      targets:
        Oesap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OesapTests
        - OesapUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
