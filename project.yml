name: Oesap

options:
  minimumXcodeGenVersion: 2.46.0
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  Oesap:
    type: application
    platform: iOS
    sources:
      - path: Sources/Oesap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oesap.app
        PRODUCT_NAME: Oesap
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Oesap/Transport/Crypto/Oesap-Bridging-Header.h
    info:
      path: Oesap-Info.plist
      properties:
        NSLocalNetworkUsageDescription: Oesap connects to a Paseo daemon on your local network when you choose a direct host connection.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  OesapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/OesapTests
    dependencies:
      - target: Oesap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oesap.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Oesap

  OesapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/OesapUITests
    dependencies:
      - target: Oesap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oesap.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: Oesap

schemes:
  Oesap:
    build:
      targets:
        Oesap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OesapTests
        - OesapUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
